<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Band</title>
<meta name="description" content="Piano, drums, guitar and flute in one landscape app.">
<meta name="theme-color" content="#ded6c4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Band">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efe9dc;
  --bar: #ded6c4;
  --ink: #1d2a2a;
  --muted: #5d6a68;
  --edge: #bdb5a1;
  --key: #fffdf7;
  --key-shade: #e9e3d2;
  --key-on: #f2b134;
  --black: #1b2626;
  --black-on: #c9540f;
  --accent: #1f8a83;
  --rec: #c62d2d;
  --pad: #fffdf7;
  --pad-ring: #1f8a83;
  --wood: #6b4528;
  --wood-2: #4e311c;
  --fret: #c9b98f;
  --string: #e9dfc8;
  --string-hit: #f2b134;
  --flute: #fffdf7;
  --flute-alt: #f4eee0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1818; --bar: #172424; --ink: #efe9da; --muted: #93a39f; --edge: #3a4a48;
    --key: #f4efe2; --key-shade: #d8d1bd; --key-on: #f2b134;
    --black: #070c0c; --black-on: #e0692a; --accent: #2fb3a8; --rec: #ef5350;
    --pad: #1c2b2b; --pad-ring: #2fb3a8;
    --wood: #4a2f1b; --wood-2: #2f1d10; --fret: #8f8262; --string: #d9cfb6; --string-hit: #f2b134;
    --flute: #1c2b2b; --flute-alt: #213333;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1818; --bar: #172424; --ink: #efe9da; --muted: #93a39f; --edge: #3a4a48;
  --key: #f4efe2; --key-shade: #d8d1bd; --key-on: #f2b134;
  --black: #070c0c; --black-on: #e0692a; --accent: #2fb3a8; --rec: #ef5350;
  --pad: #1c2b2b; --pad-ring: #2fb3a8;
  --wood: #4a2f1b; --wood-2: #2f1d10; --fret: #8f8262; --string: #d9cfb6; --string-hit: #f2b134;
  --flute: #1c2b2b; --flute-alt: #213333;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font-family: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.bar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: var(--bar); overflow-x: auto; flex: 0 0 auto; touch-action: pan-x;
}
.bar::-webkit-scrollbar { display: none; }
.sep { flex: 1 0 8px; }
button, select {
  font: inherit; font-size: .85rem; color: var(--ink); background: var(--bg);
  border: 2px solid var(--edge); border-radius: 10px; padding: 4px 10px;
  min-height: 36px; white-space: nowrap; touch-action: manipulation; flex: 0 0 auto;
}
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
button.rec[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); }
button:disabled { opacity: .45; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.oct { min-width: 38px; font-weight: 700; }
.lbl { font-size: .8rem; color: var(--muted); flex: 0 0 auto; }

/* Instrument tabs */
.tabs {
  display: flex; flex: 0 0 auto; padding: 2px; gap: 2px;
  background: var(--bg); border: 2px solid var(--edge); border-radius: 12px;
}
.tab { border: 0; border-radius: 8px; min-height: 32px; padding: 2px 12px; background: transparent; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Per-instrument visibility */
body:not([data-tab="piano"]) .only-piano,
body:not([data-tab="drums"]) .only-drums,
body:not([data-tab="guitar"]) .only-guitar,
body:not([data-tab="flute"]) .only-flute { display: none !important; }
@media (display-mode: fullscreen), (display-mode: standalone) { #full { display: none; } }

.stage { position: relative; flex: 1 1 auto; min-height: 0; padding: 4px 8px 10px; }
.view { height: 100%; }

/* Piano */
.piano { position: relative; height: 100%; display: flex; touch-action: none; }
.key {
  flex: 1 1 0; min-width: 0; background: linear-gradient(var(--key), var(--key) 82%, var(--key-shade));
  border: 1px solid var(--edge); border-radius: 0 0 8px 8px; margin: 0; padding: 0 0 8px;
  min-height: 0; display: flex; align-items: flex-end; justify-content: center;
  font-size: .7rem; color: var(--muted); touch-action: none;
}
.key.on { background: var(--key-on); }
.bkey {
  position: absolute; top: 0; height: 60%; background: var(--black); border: 0;
  border-radius: 0 0 6px 6px; z-index: 2; min-height: 0; padding: 0; touch-action: none;
  box-shadow: 0 3px 5px rgba(0,0,0,.35);
}
.bkey.on { background: var(--black-on); }

/* Drums */
.pads {
  height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
  gap: 10px; touch-action: none;
}
.pad {
  min-height: 0; border-radius: 16px; border: 2px solid var(--edge); background: var(--pad);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 1rem; font-weight: 700; touch-action: none; position: relative; overflow: hidden;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.08);
}
.pad small { font-size: .7rem; font-weight: 500; color: var(--muted); }
.pad.on { background: var(--key-on); border-color: var(--key-on); color: #1d2a2a; box-shadow: none; }
.pad.on small { color: #1d2a2a; }

/* Guitar */
.guitar { display: flex; gap: 8px; height: 100%; }
.chords {
  flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, 54px); grid-template-rows: repeat(5, 1fr);
  gap: 6px; min-height: 0;
}
.chords button { min-height: 0; padding: 0; font-weight: 700; font-size: .95rem; }
.neck {
  position: relative; flex: 1 1 auto; min-width: 0; border-radius: 14px; overflow: hidden; touch-action: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(20% - 3px), var(--fret) calc(20% - 3px) 20%),
    linear-gradient(180deg, var(--wood), var(--wood-2));
}
.gstr { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.gstr i {
  position: absolute; left: 0; right: 0; top: 0; transform: translateY(-50%);
  background: var(--string); border-radius: 2px; box-shadow: 0 2px 2px rgba(0,0,0,.4);
}
.gstr.hit i { background: var(--string-hit); }
.gstr.mute i { opacity: .35; }
.gstr b {
  position: absolute; left: 8px; top: 0; transform: translateY(-130%);
  font-size: .72rem; font-weight: 700; color: var(--string); opacity: .9;
}
.hint {
  position: absolute; right: 12px; bottom: 8px; font-size: .75rem; color: var(--string); opacity: .75; pointer-events: none;
}

/* Flute */
.flute {
  position: relative; height: 100%; border-radius: 16px; overflow: hidden; touch-action: none;
  border: 2px solid var(--edge); display: flex; background: var(--flute);
}
.fcell {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding-bottom: 8px; font-size: .72rem; color: var(--muted); border-left: 1px solid var(--edge); pointer-events: none;
}
.fcell:first-of-type { border-left: 0; }
.fcell:nth-of-type(even) { background: var(--flute-alt); }
.fcell.root { color: var(--ink); font-weight: 700; }
.fcell.on { background: var(--key-on); color: #1d2a2a; }
.fdot {
  position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  border: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent);
  pointer-events: none; display: none;
}
.flute .fhint { position: absolute; left: 12px; top: 8px; font-size: .75rem; color: var(--muted); pointer-events: none; }

.panel {
  position: absolute; z-index: 5; right: 8px; top: 4px; width: min(420px, calc(100% - 16px));
  background: var(--bar); border: 2px solid var(--edge); border-radius: 14px; padding: 10px 12px;
  display: none; max-height: calc(100% - 8px); overflow-y: auto; touch-action: pan-y;
}
.panel.open { display: block; }
.panel .r { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
.panel .r span { font-size: .85rem; }
.panel input[type=range] { width: 100%; accent-color: var(--accent); }
.panel select { width: 100%; }

.rotate {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
}
.rotate svg { width: 84px; height: 84px; }
.rotate h2 { margin: 0; font-size: 1.15rem; }
.rotate p { margin: 0; color: var(--muted); max-width: 28ch; }
@media (orientation: portrait) { body:not(.allow-portrait) .rotate { display: flex; } }
</style>
</head>
<body data-tab="piano">

<div class="bar" id="bar">
  <div class="tabs" role="tablist" aria-label="Instrument">
    <button class="tab" role="tab" data-tab="piano" aria-selected="true">Piano</button>
    <button class="tab" role="tab" data-tab="drums" aria-selected="false">Drums</button>
    <button class="tab" role="tab" data-tab="guitar" aria-selected="false">Guitar</button>
    <button class="tab" role="tab" data-tab="flute" aria-selected="false">Flute</button>
  </div>

  <select id="inst" class="only-piano" aria-label="Piano sound">
    <option value="piano">Grand piano</option>
    <option value="epiano">Electric piano</option>
    <option value="organ">Organ</option>
    <option value="synth">Synth lead</option>
    <option value="pad">Warm pad</option>
    <option value="bell">Bells</option>
  </select>
  <button class="oct only-piano" id="octDown" aria-label="Octave down">−</button>
  <span class="lbl only-piano" id="octLbl">C3</span>
  <button class="oct only-piano" id="octUp" aria-label="Octave up">+</button>
  <button id="sustain" class="only-piano" aria-pressed="false">Sustain</button>
  <button id="rec" class="rec only-piano" aria-pressed="false">Record</button>
  <button id="play" class="only-piano" disabled>Play</button>

  <select id="kit" class="only-drums" aria-label="Drum kit">
    <option value="acoustic">Acoustic kit</option>
    <option value="electro">Electro kit</option>
  </select>

  <select id="gsound" class="only-guitar" aria-label="Guitar sound">
    <option value="acoustic">Steel acoustic</option>
    <option value="nylon">Nylon</option>
    <option value="electric">Electric</option>
  </select>
  <button id="ring" class="only-guitar" aria-pressed="false">Let ring</button>

  <select id="fkey" class="only-flute" aria-label="Flute key"></select>
  <select id="fscale" class="only-flute" aria-label="Flute scale">
    <option value="major">Major</option>
    <option value="minor">Minor</option>
    <option value="penta">Major penta</option>
    <option value="minpenta">Minor penta</option>
    <option value="blues">Blues</option>
    <option value="chromatic">Chromatic</option>
  </select>
  <select id="fmode" class="only-flute" aria-label="Pitch slide">
    <option value="slide">Slide</option>
    <option value="snap">Snap</option>
    <option value="free">Free</option>
  </select>

  <span class="sep"></span>
  <button id="more" aria-pressed="false">Settings</button>
  <button id="full">Full screen</button>
</div>

<div class="stage">
  <div class="view only-piano"><div class="piano" id="piano"></div></div>

  <div class="view only-drums"><div class="pads" id="pads"></div></div>

  <div class="view only-guitar">
    <div class="guitar">
      <div class="chords" id="chords" role="group" aria-label="Chord"></div>
      <div class="neck" id="neck" aria-label="Strings: tap to pluck, swipe up or down to strum">
        <span class="hint">Swipe across the strings to strum</span>
      </div>
    </div>
  </div>

  <div class="view only-flute">
    <div class="flute" id="flute" aria-label="Flute: slide left and right to change pitch">
      <span class="fhint">Slide sideways for pitch · higher up is louder</span>
      <div class="fdot" id="fdot"></div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="r"><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
    <div class="r"><span>Reverb</span><input type="range" id="rev" min="0" max="1" step="0.01" value="0.25"></div>
    <div class="r only-piano"><span>Vibrato</span><input type="range" id="vib" min="0" max="1" step="0.01" value="0"></div>
    <div class="r only-piano"><span>Keys</span>
      <select id="range">
        <option value="2">2 octaves</option>
        <option value="3" selected>3 octaves</option>
        <option value="4">4 octaves</option>
      </select></div>
    <div class="r only-piano"><span>Chords</span>
      <select id="chord">
        <option value="off">Single notes</option>
        <option value="major">Major chord</option>
        <option value="minor">Minor chord</option>
        <option value="octave">Octave</option>
      </select></div>
    <div class="r"><span>Note labels</span>
      <select id="labels">
        <option value="names">Note names</option>
        <option value="sargam">Sa Re Ga</option>
        <option value="off">None</option>
      </select></div>
    <div class="r only-piano"><span>Touch strength</span>
      <select id="vel">
        <option value="on">Lower on key = louder</option>
        <option value="off">Same volume</option>
      </select></div>
    <div class="r"><span>Max notes</span>
      <select id="maxv">
        <option value="8">8 (older phones)</option>
        <option value="14" selected>14</option>
        <option value="20">20</option>
      </select></div>
  </div>
</div>

<div class="rotate" role="alert">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="20" y="6" width="24" height="42" rx="4"/><path d="M32 42h.01"/><path d="M10 40c-3-8 0-17 8-22M54 58c3 0 4-3 4-6"/><path d="M14 22l4-4 4 4"/>
  </svg>
  <h2>Turn your phone sideways</h2>
  <p>The instruments need a wide screen.</p>
  <button id="anyway">Play anyway</button>
</div>

<script>
(function () {
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx, bus, master, wet, lfoDepth, noiseBuf, drive;
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    tab: 'piano', inst: 'piano', octave: 3, range: 3, chord: 'off', labels: 'names',
    velocity: true, pedal: false, vol: 0.8, rev: 0.25, vib: 0
  };

  /* ---------- Audio engine ---------- */
  function init() {
    if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain(); master.gain.value = state.vol;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    var conv = ctx.createConvolver();
    var len = Math.floor(ctx.sampleRate * 1.8);
    var ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = ir.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    conv.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = state.rev;
    bus.connect(conv); conv.connect(wet); wet.connect(master);
    var lfo = ctx.createOscillator(); lfo.frequency.value = 5.5;
    lfoDepth = ctx.createGain(); lfoDepth.gain.value = state.vib * 35;
    lfo.connect(lfoDepth); lfo.start();

    // Shared white noise for drums and flute breath
    var nlen = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
    var nd = noiseBuf.getChannelData(0);
    for (var n = 0; n < nlen; n++) nd[n] = Math.random() * 2 - 1;

    // Shared overdrive for electric guitar (one shaper, not one per note)
    drive = ctx.createGain(); drive.gain.value = 2.5;
    var shaper = ctx.createWaveShaper(), curve = new Float32Array(1024);
    for (var s = 0; s < 1024; s++) curve[s] = Math.tanh((s / 511.5 - 1) * 2.2);
    shaper.curve = curve;
    var tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 4200;
    var trim = ctx.createGain(); trim.gain.value = 0.3;
    drive.connect(shaper); shaper.connect(tone); tone.connect(trim); trim.connect(bus);
  }

  // Every sounding note, from every instrument, lives here so the total stays bounded.
  var live = [], MAX_VOICES = 14;

  function track(v) {
    live = live.filter(function (x) { return !x.done; });
    live.push(v);
    while (live.length > MAX_VOICES) releaseVoice(live.shift(), 0.05);
  }

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function makeVoice(inst, midi, vel) {
    var f = mtof(midi), t = ctx.currentTime;
    var g = ctx.createGain(), flt = ctx.createBiquadFilter();
    flt.type = 'lowpass';
    var oscs = [];
    function osc(type, mult, level, detune) {
      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = type; o.frequency.value = f * mult;
      if (detune) o.detune.value = detune;
      og.gain.value = level;
      o.connect(og); og.connect(flt);
      if (state.vib > 0) lfoDepth.connect(o.detune);
      o.onended = function () { try { lfoDepth.disconnect(o.detune); } catch (e) {} };
      o.start(t); oscs.push(o);
    }
    var peak = 0.45 * vel, v = { g: g, oscs: oscs, rel: 0.25, sustained: false, done: false, timer: null };
    g.gain.setValueAtTime(0.0001, t);

    function decaying(total, mid) {
      g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
      g.gain.exponentialRampToValueAtTime(peak * mid, t + 0.45);
      g.gain.exponentialRampToValueAtTime(0.0001, t + total);
      oscs.forEach(function (o) { o.stop(t + total + 0.1); });
    }
    function held(attack, level, rel) {
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.linearRampToValueAtTime(peak * level, t + attack + 0.3);
      v.sustained = true; v.rel = rel;
      v.timer = setTimeout(function () { releaseVoice(v, rel); }, 25000);
    }

    switch (inst) {
      case 'epiano':
        osc('sine', 1, 0.8); osc('triangle', 2, 0.2);
        flt.frequency.value = 3200; decaying(3.2, 0.45); break;
      case 'organ':
        osc('sine', 1, 0.5); osc('sine', 2, 0.3); osc('sine', 3, 0.15);
        flt.frequency.value = 6000; held(0.012, 0.85, 0.08); break;
      case 'synth':
        osc('sawtooth', 1, 0.4, -7); osc('sawtooth', 1, 0.4, 7);
        flt.frequency.value = Math.min(6000, f * 4 + 800); held(0.01, 0.7, 0.18); break;
      case 'pad':
        osc('sawtooth', 1, 0.3, -9); osc('triangle', 1, 0.45, 9);
        flt.frequency.value = 1500; held(0.4, 0.9, 1.1); break;
      case 'bell':
        osc('sine', 1, 0.6); osc('sine', 2.76, 0.25);
        flt.frequency.value = 9000; decaying(4, 0.3); break;
      default:
        osc('triangle', 1, 0.75); osc('sine', 2, 0.25);
        flt.frequency.value = Math.min(9000, f * 6 + 1500); decaying(4.5, 0.4);
    }
    flt.connect(g); g.connect(bus);
    oscs[0].addEventListener('ended', function () { v.done = true; });
    track(v);
    return v;
  }

  function releaseVoice(v, rel) {
    if (!v || v.done) return;
    v.done = true; clearTimeout(v.timer);
    var t = ctx.currentTime;
    try {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t);
      v.g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    } catch (e) {}
    v.oscs.forEach(function (o) { try { o.stop(t + rel + 0.05); } catch (e) {} });
  }

  // Marks a multi-source voice done once its longest source has ended
  function doneWhenEnded(v, src) { src.onended = function () { v.done = true; }; }

  /* ---------- Piano: note state, lights, recording ---------- */
  var active = {}, pedalHeld = [], lit = {}, keyEls = {};
  var recording = false, recStart = 0, rec = [], playing = false, pbTimers = [];

  function light(midi, d) {
    lit[midi] = Math.max(0, (lit[midi] || 0) + d);
    var el = keyEls[midi];

      var t = ctx.currentTime, f = mtof(at.midi), tc = fl.mode === 'snap' ? 0.012 : 0.025;
      fl.v.os.forEach(function (o) { o.frequency.setTargetAtTime(f * o.mult, t, tc); });
      fl.v.ex.gain.setTargetAtTime(lvl, t, 0.04);
      fl.v.lp.frequency.setTargetAtTime(1400 + 4200 * lvl, t, 0.04);
    }
    if (fl.cur !== at.idx) {
      if (fl.cells[fl.cur]) fl.cells[fl.cur].classList.remove('on');
      fl.cur = at.idx; fl.cells[fl.cur].classList.add('on');
    }
    fdot.style.display = 'block';
    fdot.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  function fluteSilence() {
    if (fl.v) { releaseVoice(fl.v, fl.v.rel); fl.v = null; }
    if (fl.cells[fl.cur]) fl.cells[fl.cur].classList.remove('on');
    fl.cur = -1; fdot.style.display = 'none';
  }

  function fluteUp(id) {
    if (!fl.pos[id]) return;
    delete fl.pos[id];
    fl.stack = fl.stack.filter(function (x) { return x !== id; });
    fluteApply();
  }

  function fluteStopAll() { fl.stack = []; fl.pos = {}; fluteSilence(); }

  flute.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { flute.setPointerCapture(e.pointerId); } catch (err) {}
    fl.rect = flute.getBoundingClientRect();
    fl.pos[e.pointerId] = { x: e.clientX, y: e.clientY };
    fl.stack.push(e.pointerId);
    fluteApply();
  });
  flute.addEventListener('pointermove', function (e) {
    if (!fl.pos[e.pointerId]) return;
    fl.pos[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (!fl.raf) fl.raf = requestAnimationFrame(fluteApply);
  });
  flute.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- Releasing notes: every path that ends a touch ---------- */
  function releasePointer(id) {
    noteOff(id);
    gtrRelease(id);
    fluteUp(id);
  }
  // Silence everything a finger, mouse or key is holding (not piano playback)
  function releaseAllHeld() {
    moveQ = {};
    Object.keys(active).forEach(function (k) { if (k.indexOf('pb') !== 0) noteOff(k); });
    Object.keys(gtr.held).forEach(gtrRelease);
    fluteStopAll();
  }

  window.addEventListener('pointerup', function (e) { releasePointer(e.pointerId); });
  window.addEventListener('pointercancel', function (e) { releasePointer(e.pointerId); });
  document.documentElement.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse') releasePointer(e.pointerId);
  });
  window.addEventListener('blur', releaseAllHeld);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAllHeld(); });

  // Safety net: when no finger is on the screen, nothing touch-driven may keep sounding
  function noTouchesLeft(e) {
    if (e.touches.length) return;
    moveQ = {};
    Object.keys(active).forEach(function (k) { if (/^\d+$/.test(k)) noteOff(k); });
    Object.keys(gtr.held).forEach(function (k) { if (/^\d+$/.test(k)) gtrRelease(k); });
    fluteStopAll();
  }
  window.addEventListener('touchend', noTouchesLeft, { passive: true });
  window.addEventListener('touchcancel', noTouchesLeft, { passive: true });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  piano.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- Computer keyboard ---------- */
  var KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15 };
  var PADKEYS = {};
  PADS.forEach(function (p) { PADKEYS[p.key] = p.id; });
  window.addEventListener('keydown', function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'select' || tag === 'input') return;
    var k = e.key.toLowerCase();
    if (state.tab === 'piano') {
      if (KEYMAP[k] !== undefined) noteOn('kb' + k, baseMidi() + 12 + KEYMAP[k], 0.85, state.inst, CHORDS[state.chord]);
      else if (k === 'z') setOctave(state.octave - 1);
      else if (k === 'x') setOctave(state.octave + 1);
    } else if (state.tab === 'drums') {
      if (PADKEYS[k]) hitPad(PADKEYS[k], 0.9);
    } else if (state.tab === 'guitar') {
      if (k === ' ') { e.preventDefault(); strum('kb '); }
      else if (k >= '1' && k <= '6') pluck(+k - 1, 0.8, 'kb' + k);
    }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    noteOff('kb' + k);
    gtrRelease(k === ' ' ? 'kb ' : 'kb' + k);
  });

  /* ---------- Tabs ---------- */
  function setTab(tab) {
    releaseAllHeld();
    if (playing) stopPlayback();
    if (recording) $('rec').click();
    state.tab = tab;
    document.body.dataset.tab = tab;
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab); });
    rects = {};
    try { localStorage.setItem('pb-tab', tab); } catch (e) {}
  }
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) setTab(b.dataset.tab);
  });

  /* ---------- Toolbar ---------- */
  $('inst').onchange = function () { state.inst = this.value; stopAll(); };
  $('octDown').onclick = function () { setOctave(state.octave - 1); };
  $('octUp').onclick = function () { setOctave(state.octave + 1); };

  $('sustain').onclick = function () {
    state.pedal = !state.pedal;
    this.setAttribute('aria-pressed', state.pedal);
    if (!state.pedal) releasePedal();
  };

  function refreshButtons() {
    $('rec').setAttribute('aria-pressed', recording);
    $('rec').textContent = recording ? 'Stop recording' : 'Record';
    $('play').textContent = playing ? 'Stop' : 'Play';
    $('play').disabled = !playing && (recording || rec.length === 0);
  }

  $('rec').onclick = function () {
    init();
    if (playing) stopPlayback();
    if (recording) {
      recording = false;
      if (rec.length) {
        var t0 = rec[0].t;
        rec.forEach(function (ev) { ev.t -= t0; });
      }
    } else {
      rec = []; recording = true; recStart = performance.now();
    }
    refreshButtons();
  };

  function stopPlayback() {
    pbTimers.forEach(clearTimeout); pbTimers = [];
    Object.keys(active).forEach(function (k) { if (String(k).indexOf('pb') === 0) noteOff(k, true); });
    playing = false; refreshButtons();
  }

  $('play').onclick = function () {
    if (playing) { stopPlayback(); return; }
    if (!rec.length) return;
    init();
    playing = true; refreshButtons();
    rec.forEach(function (ev) {
      pbTimers.push(setTimeout(function () {
        var id = 'pb' + ev.key;
        if (ev.type === 'on') noteOn(id, ev.midi, ev.vel, ev.inst, ev.iv, true);
        else noteOff(id, true);
      }, ev.t));
    });
    pbTimers.push(setTimeout(stopPlayback, rec[rec.length - 1].t + 1200));
  };

  $('kit').onchange = function () { drumKit = this.value; };
  $('gsound').onchange = function () { gtr.sound = this.value; };
  $('ring').onclick = function () {
    gtr.ring = !gtr.ring;
    this.setAttribute('aria-pressed', gtr.ring);
  };

  var fkey = $('fkey');
  CHROMA.forEach(function (n, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = 'Key ' + n; fkey.appendChild(o);
  });
  fkey.onchange = function () { fl.key = +this.value; buildFlute(); };
  $('fscale').onchange = function () { fl.scale = this.value; buildFlute(); };
  $('fmode').onchange = function () { fl.mode = this.value; };

  $('more').onclick = function () {
    var open = $('panel').classList.toggle('open');
    this.setAttribute('aria-pressed', open);
  };

  $('full').onclick = function () {
    try {
      var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (p && p.then) p.then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  };

  /* ---------- Settings panel ---------- */
  $('vol').oninput = function () { state.vol = +this.value; if (master) master.gain.value = state.vol; };
  $('rev').oninput = function () { state.rev = +this.value; if (wet) wet.gain.value = state.rev; };
  $('vib').oninput = function () { state.vib = +this.value; if (lfoDepth) lfoDepth.gain.value = state.vib * 35; };
  $('range').onchange = function () { state.range = +this.value; setOctave(state.octave); };
  $('chord').onchange = function () { state.chord = this.value; };
  $('labels').onchange = function () { state.labels = this.value; buildPiano(); buildFlute(); };
  $('vel').onchange = function () { state.velocity = this.value === 'on'; };
  $('maxv').onchange = function () { MAX_VOICES = +this.value; };

  $('anyway').onclick = function () { document.body.classList.add('allow-portrait'); };

  buildPiano();
  buildPads();
  buildGuitar();
  buildFlute();
  refreshButtons();
  var saved = null;
  try { saved = localStorage.getItem('pb-tab'); } catch (e) {}
  if (saved && /^(piano|drums|guitar|flute)$/.test(saved)) setTab(saved);

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
